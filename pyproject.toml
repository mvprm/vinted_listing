[project]
name = "vinted-listing"
version = "0.1.0"
description = "Turn product photos dropped into Google Drive into ready-to-post Vinted listings."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pillow",
    "pillow-heif",
    "opencv-python-headless",
    "numpy",
    "rembg[cpu]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]
vision = ["google-cloud-vision"]

[project.scripts]
vinted-listing = "vinted_listing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinted_listing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Repo-local temp dir: a broken %TEMP%\pytest-of-<user> folder must not break the suite.
addopts = "-m 'not live' --basetemp=.pytest_tmp"
markers = ["live: calls real external services or downloads models (run with -m live)"]
