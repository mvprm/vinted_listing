[project]
name = "vinted-listing"
version = "0.1.0"
description = "Turn product photos dropped into Google Drive into ready-to-post second-hand listings with Claude."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mvprm" }]
requires-python = ">=3.12"
keywords = ["claude", "anthropic", "llm", "computer-vision", "background-removal", "second-hand", "listing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "anthropic>=2.3,<3",
    "pydantic>=2.14,<3",
    "pillow>=13,<14",
    "pillow-heif>=1.8,<2",
    "opencv-python-headless>=5.0,<6",
    "numpy>=2.5,<3",
    "rembg[cpu]>=2.0.86,<3",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
vision = ["google-cloud-vision"]  # reserved for the planned reverse image match

[project.urls]
Homepage = "https://github.com/mvprm/vinted_listing"
Documentation = "https://github.com/mvprm/vinted_listing/blob/main/docs/design.md"
Issues = "https://github.com/mvprm/vinted_listing/issues"
Changelog = "https://github.com/mvprm/vinted_listing/blob/main/CHANGELOG.md"

[project.scripts]
vinted-listing = "vinted_listing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinted_listing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Repo-local temp dir: a broken %TEMP%\pytest-of-<user> folder must not break the suite.
addopts = "-m 'not live' --basetemp=.pytest_tmp"
markers = ["live: calls real external services or downloads models (run with -m live)"]
