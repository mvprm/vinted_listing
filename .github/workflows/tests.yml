name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install (exact versions from uv.lock)
        run: uv sync --locked --extra dev --python 3.12

      - name: Offline test suite (live tests are excluded by default)
        run: uv run --no-sync pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (not pushed anywhere)
        run: docker build -t vinted-listing:ci .

      - name: Native libraries import inside the image
        run: docker run --rm --entrypoint python vinted-listing:ci -c "import cv2, onnxruntime, pillow_heif, rembg, vinted_listing.cli"

      - name: Commands run as the container user with its default paths
        run: |
          docker run --rm -e ANTHROPIC_API_KEY=unused vinted-listing:ci costs
          # No watcher has run, so health must report unhealthy (exit 1).
          if docker run --rm vinted-listing:ci health; then echo "health should fail without a heartbeat"; exit 1; fi
