name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install (exact versions from uv.lock)
        run: uv sync --locked --extra dev --python 3.12

      - name: Offline test suite (live tests are excluded by default)
        run: uv run --no-sync pytest
